<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hola Mundo - Gestor de Proyectos MVP</title>
  <style>
    :root {
      --accent-yellow: #ecad0a;
      --primary-blue: #209dd7;
      --secondary-purple: #753991;
      --dark-navy: #032147;
      --text-gray: #888888;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: var(--dark-navy);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #ffffff;
      border-top: 4px solid var(--accent-yellow);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(3, 33, 71, 0.08);
      max-width: 520px;
      width: 100%;
      padding: 2rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.5rem;
      color: var(--dark-navy);
    }
    p {
      margin: 0 0 1.25rem;
      color: var(--text-gray);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .response-box {
      background: #f1f5f9;
      border-left: 4px solid var(--primary-blue);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      font-family: monospace;
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
      word-break: break-word;
    }
    button {
      background-color: var(--secondary-purple);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 0.65rem 1.2rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.92;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hola Mundo</h1>
    <p> Infraestructura base de Docker y FastAPI en funcionamiento.</p>
    <div id="api-response" class="response-box">Consultando /api/hello...</div>
    <button id="refresh-btn" type="button">Consultar API nuevamente</button>
  </main>

  <script>
    async function fetchHello() {
      const box = document.getElementById("api-response");
      box.textContent = "Consultando /api/hello...";
      try {
        const res = await fetch("/api/hello");
        if (!res.ok) {
          throw new Error("HTTP " + res.status);
        }
        const data = await res.json();
        box.textContent = data.message + " (status " + res.status + ")";
      } catch (err) {
        box.textContent = "Error al consultar la API: " + err.message;
      }
    }

    document.getElementById("refresh-btn").addEventListener("click", fetchHello);
    fetchHello();
  </script>
</body>
</html>
